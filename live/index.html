:root{
  --bg-alpha:0; --row:#16181e; --row-on:#24324a; --line:#262a33; --on:#1f5fd6;
  --text:#e9ecf1; --dim:#8a92a3; --faint:#5b6273;
  --ahead:#4cd07d; --behind:#ef5b5b; --gold:#f5c542; --blue:#6aa8ff;
}
*{box-sizing:border-box;border-radius:0}
button{-webkit-appearance:none;appearance:none}
html,body{margin:0}
html,body{background:transparent}
/* The Minecraft font is drawn on a grid of 1/10 of its size: text is only at sizes that are multiples of 10 (so its
   pixels land on whole screen pixels and it stays sharp), with Minecraft's shadow, one of those pixels down and right */
body,body *{text-shadow:.1em .1em 0 #000}
body{color:var(--text);font-family:"Minecraft",ui-monospace,monospace;font-size:20px;line-height:1.25;-webkit-font-smoothing:none}
.split{margin:0;width:440px}
.box{overflow:hidden;background:rgba(0,0,0,var(--bg-alpha))}
.head{padding:8px 12px 6px;border-bottom:2px solid var(--line);text-align:center}
.t1{font-weight:700;font-size:20px;white-space:nowrap}
.t2{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:baseline;font-size:20px}
.t2 .num{text-align:right;white-space:nowrap}
.t3{display:flex;justify-content:center;gap:28px;margin-top:2px;font-size:20px;white-space:nowrap}
.rows{padding:2px 0}
.r{display:grid;grid-template-columns:32px 1fr auto 90px;align-items:center;gap:8px;padding:1px 12px;min-height:34px}
.r.on{background:var(--on);color:#fff}
/* sub-splits: indented under their split, without icons and a little shorter */
.r.sub{padding-left:28px}
.r.blank{visibility:hidden}
.d.prog{color:var(--dim)}
.r.parent .n{font-weight:700}
/* (the icons are 32 pixels: shown at exactly that, so every texture pixel is the same size) */
.r img{width:32px;height:32px;image-rendering:pixelated}
.r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .d{text-align:right;min-width:58px}
.r .tm{text-align:right}
.ahead{color:#2ee86a} .ahead-lose{color:#8fe3a9} .behind-gain{color:#f08a80} .behind{color:#ff3b30} .gold{color:var(--gold)}
.detail{display:flex;align-items:flex-end;gap:10px;padding:6px 12px 2px}
.dl{flex:1;min-width:0;display:grid;gap:2px;padding-bottom:2px}
.dc{font-size:20px;white-space:nowrap;cursor:pointer}
.t2 .st{text-align:left;color:var(--dim);font-size:20px;white-space:nowrap}
.dr{text-align:right;white-space:nowrap}
.big{font-size:50px;font-weight:700;line-height:.86;font-variant-numeric:tabular-nums}
.big .ms{font-size:30px}
.big.paused{color:var(--dim)}
.seg{color:var(--dim);font-size:30px;line-height:1;margin-top:-1px}
.seg .ms{font-size:20px}
.info{margin-top:6px;padding:4px 12px 8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:1px 0;font-size:20px}
.note{color:var(--dim);font-size:20px;padding:10px 12px;border-top:2px solid var(--line);overflow-wrap:anywhere}
.hide{display:none}
</style>
</head>
<body>
<div class="split">
  <div class="box">
    <div class="head">
      <div class="t2"><span class="st" id="status"></span><span class="t1" id="title">AA Live</span><span class="num" id="num"></span></div>
      <div class="t3"><span id="pbT"></span><span id="wrT"></span></div>
    </div>
    <div class="rows" id="rows"></div>
    <div class="detail">

      <div class="dr"><div class="big" id="timer">0:00:00<span class="ms">.000</span></div><div class="seg" id="segTimer"></div></div>
    </div>
    <div class="info" id="info"></div>
    <div class="note hide" id="note"></div>
    <div class="note hide" id="phone"></div>
  </div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
// how many splits and sub-splits are listed at once: ?rows= (6 without it)
const ROWS = Math.max(2, Math.min(30, parseInt(P.get("rows")) || 6));
// the background: ?bg=0 to 100 (or 60%) makes it that much black. Without it: see-through in OBS, and black in a
// browser tab (where there's nothing behind the page)
const bgParam = parseFloat(P.get("bg"));
const bg = Number.isFinite(bgParam) ? Math.min(100, Math.max(0, bgParam)) : window.obsstudio ? 0 : 100;
document.documentElement.style.setProperty("--bg-alpha", bg / 100);
// (in a browser, all of the page is black, past the end of the splits too)
if (!window.obsstudio && !Number.isFinite(bgParam)) document.documentElement.style.background = "#000";
// ?scale=1.5 makes it all that much bigger (it's 440 pixels wide at 1)

const scale = parseFloat(P.get("scale"));

const fit = () => { const w = Math.min(innerWidth, screen.width || innerWidth); const z = Number.isFinite(scale) && scale > 0 ? scale : !window.obsstudio && w < 440 ? w / 440 : 1; document.querySelector(".split").style.zoom = z; };

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
// 1:02:03, or 2:03 under an hour
const fmt = (ms, long) => { if (ms == null) return "—"; const s = Math.floor(Math.max(0, ms) / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, "0"); return h || long ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
// the same with milliseconds, smaller
// (?ms= is how many decimals: 0 to 3, 3 without it)
const decimals = /^[0-3]$/.test(P.get("ms") || "") ? Number(P.get("ms")) : 3;
const fmtMs = (ms, long) => fmt(ms, long) + (decimals ? `<span class="ms">.${String(Math.floor(Math.max(0, ms)) % 1000).padStart(3, "0").slice(0, decimals)}</span>` : "");
// a difference: −9.4 under a minute, otherwise −1:23 (or +1:02:03)
const delta = ms => (ms < 0 ? "−" : "+") + (Math.abs(ms) < 60000 ? (Math.floor(Math.abs(ms) / 100) / 10).toFixed(1) : fmt(Math.abs(ms)));
// LiveSplit's colours: ahead or behind, and gaining or losing time in that split (gold: the best that split has been)
const colour = (d, gain, gold) => gold ? "gold" : d <= 0 ? (gain ? "ahead" : "ahead-lose") : (gain ? "behind-gain" : "behind");

let heard = 0, relayComps = null;
const gunzip = async b64 => new Response(new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
const channel = RELAY ? decodeURIComponent(location.hash.slice(1)) : "";
const NTFY = P.get("relay") || "https://ntfy.sh";   // (?relay=: another ntfy server, for testing)
const es = RELAY ? (channel ? new EventSource(`${NTFY}/${encodeURIComponent(channel)}/sse?since=1h`) : null) : new EventSource("/events");
if (es) es.onmessage = async e => {
  let o = JSON.parse(e.data);
  if (RELAY) {
    if (o.event !== "message" || !o.message) return;
    try { o = JSON.parse(await gunzip(o.message)); } catch { return; }
    if (o.comps) relayComps = o.comps;
    if (!o.splits) { if (S) S.comps = relayComps; return; }
    o = {...o, comps: relayComps || {}, icons: RELAY_ICONS};
    heard = Date.now();
  }
  S = o; connected = true; render();
};
if (es) es.onerror = () => { connected = false; render(); };

// clicking the comparison changes it
$("segComp").onclick = () => {
  if (!S) return;
  const have = ORDER.filter(k => S.comps[k]);
  comp = have[(have.indexOf(comp) + 1) % have.length] || "pb";
  store.set("aa-live-comp", comp);
  render();
};

// The IGT right now: from the latest line of the log, plus the time since then while the game is running
// (it never goes back while running: a new line from the game can be a few milliseconds behind the count)
let shown = 0;
function liveIgt() {
  if (!S) return 0;
  if (S.done || !S.anchor || !S.open || S.paused) return shown = S.igt;
  const t = Math.max(S.igt, S.anchor.igt + (Date.now() - S.anchor.wall));
  return shown = t < shown && shown - t < 2000 ? shown : t;
}
// (only touches the page when something changed)
const put = (el, html) => { if (el._h !== html) { el._h = html; el.innerHTML = html; } };

function render() {
  if (!S) { $("status").textContent = RELAY && !channel ? "No channel in the link" : RELAY ? "Waiting for AA Live" : connected ? "" : "Not connected"; return; }
  const C = S.comps[comp] || S.comps[ORDER.find(k => S.comps[k])] || null, best = S.comps.best, pb = S.comps.pb, wr = S.comps.wr;
  const now = liveIgt(), running = S.open && !S.paused && !S.done;
  put($("title"), esc(S.title));
  put($("num"), S.num ? "Run " + S.num : "");
  put($("pbT"), pb ? "PB: " + fmt(pb.final, true) : "");
  put($("wrT"), wr ? "WR: " + fmt(wr.final, true) : "");
  // (the phone page: nothing from AA Live for a while, though the game was running)
  const quiet = RELAY && S.open && !S.paused && !S.done && Date.now() - heard > 300000;
  $("status").textContent = !connected ? "Not connected" : quiet ? "No news from AA Live" : S.done ? "Done" : !S.world ? "Waiting for Minecraft" : !S.file ? "No Hermes log" : !S.open ? "World closed" : S.paused ? "Paused" : "";

  const rows = S.splits.map((r, i) => ({...r, i, cur: r.dur + (r.from != null ? Math.max(0, now - r.from) : 0)}));
  const ri = rows.findIndex(r => r.from != null);
  rows.forEach(r => { r.fin = S.done ? r.has : r.has && r.from == null && ri >= 0 && r.i < ri; r.on = r.i === ri; });
  const c = i => C && C.splits[i] != null ? C.splits[i] : null, b = i => best && best.splits[i] != null ? best.splits[i] : null;
  const ce = i => C && C.ends && C.ends[i] != null ? C.ends[i] : null;

  // each finished split: how far ahead or behind at its end (its split time against the comparison's)
  let prevD = 0;
  rows.forEach(r => { if (r.fin && ce(r.i) != null) { r.d = r.end - ce(r.i); r.gain = r.d <= prevD; prevD = r.d; } });

  // What's listed: each split; under the one it's on, its sub-splits (done whenever their step happens, in any order).
  // Post-endgame only when the run has one.
  const cs = (i, j) => C && C.subs && C.subs[i] && C.subs[i][j] != null ? C.subs[i][j] : null;
  // how long a step took: the comparison's, and the fastest ever (gold)
  const cd = (i, j) => C && C.subDurs && C.subDurs[i] && C.subDurs[i][j] != null ? C.subDurs[i][j] : null;
  const bd = (i, j) => best && best.subDurs && best.subDurs[i] && best.subDurs[i][j] != null ? best.subDurs[i][j] : null;
  let onSub = null;   // the step it's on: {cur, i, j}, or {cur, mid: key} for a Midgame checklist split
  // the Midgame checklist's splits: the comparison's length, and the fastest
  const mc = k => C && C.mid && C.mid[k] != null ? C.mid[k] : null, mb = k => best && best.mid && best.mid[k] != null ? best.mid[k] : null;
  // Under Midgame, the checklist for the kind of place the runner is in (MIDGAME on the stats site): its splits (running
  // while they're in its area; shown for a minute after they finish), and its counters. Under Post-endgame, what of it is
  // still not done.
  const midgame = rows[3] && rows[3].mid, extra = Math.max(0, now - S.igt);   // (extra: live time since the server worked it out)
  const checklist = i => {
    if (!midgame) return [];
    const out = [];
    if (i === 3) for (const x of midgame.sections) {
      const here = x.area.includes(midgame.area);
      if (x.split) {
        const running = x.start != null && x.end == null && x.since != null, cur = (x.dur || 0) + (running ? extra : 0);
        if (!running && !(x.complete && here && S.igt - x.end < 60000)) continue;
        const cmp = mc(x.key); let d, dc;
        if (x.complete && cmp != null) { d = delta(cur - cmp); dc = colour(cur - cmp, true, mb(x.key) != null && cur < mb(x.key)); }
        else if (running && cmp != null && cur > cmp) { d = delta(cur - cmp); dc = "behind"; }
        else { d = `${x.have}/${x.need}`; dc = "prog"; }
        if (running && !onSub) onSub = {mid: x.key, cur};
        out.push({cls: "sub" + (running ? " on" : ""), icon: "item:" + x.item, name: x.name, d, dc, tm: fmt(cur)});
      } else if (here && (x.key === "godapple" || x.need == null || x.done == null)) {
        // (the god apple: when it was got)
        const tm = x.key === "godapple" ? (x.done != null ? fmt(x.done) : "—") : x.need == null ? String(x.have) : `${x.have}/${x.need}`;
        out.push({cls: "sub", icon: "item:" + x.item, name: x.name, d: "", dc: "", tm});
      }
    }
    else for (const x of midgame.sections) if (x.need && x.done == null) out.push({cls: "sub", icon: "item:" + x.item, name: x.name, d: "", dc: "", tm: `${x.have}/${x.need}`});
    return out;
  };
  const list = [];
  for (const r of rows) {
    if (r.i === rows.length - 1 && !r.has && !r.on) continue;
    let d = "", dc = "";
    if (r.d != null) { d = delta(r.d); dc = colour(r.d, r.gain, b(r.i) != null && r.cur < b(r.i)); }
    const more = r.on && !(r.subs && r.subs.length) && (r.i === 3 || r.i === rows.length - 1) ? checklist(r.i) : [];
    const open = r.on && (r.subs && r.subs.length || more.length);
    // the split it's on: shown once it's behind (unless its sub-splits are showing that)
    if (r.d == null && r.on && !open && ce(r.i) != null && now > ce(r.i)) { const x = now - ce(r.i); d = delta(x); dc = colour(x, x <= prevD); }
    // the time: when it ended, for a finished split; otherwise the comparison's
    list.push({cls: r.on && !open ? "on" : open ? "parent" : "", icon: r.icon, name: r.name, d, dc, tm: fmt(r.fin ? r.end : ce(r.i))});
    if (!open) continue;
    if (more.length) { list.push(...more); continue; }
    // its sub-splits: the next one not done yet is the one it's on
    let pd = prevD;
    const next = r.subs.findIndex(x => x.t == null);
    // (the step it's on started when the last step before it was done, or with the split)
    if (next >= 0) onSub = {i: r.i, j: next, cur: now - Math.max(r.start ?? 0, ...r.subs.slice(0, next).map(x => x.t).filter(t => t != null))};
    r.subs.forEach((x, j) => {
      const cmp = cs(r.i, j);
      let sd = "", sc = "";
      if (x.t != null && cmp != null) { const v = x.t - cmp; sd = delta(v); sc = colour(v, v <= pd, x.dur != null && bd(r.i, j) != null && x.dur < bd(r.i, j)); pd = v; }
      else if (j === next && cmp != null && now > cmp) { const v = now - cmp; sd = delta(v); sc = colour(v, v <= pd); }
      list.push({cls: "sub" + (j === next ? " on" : ""), icon: x.item ? "item:" + x.item : null, name: x.name, d: sd, dc: sc, tm: fmt(x.t != null ? x.t : cmp)});
    });
  }
  // Only ROWS of them at once, like LiveSplit: the one it's on with the next one under it, moving down as it goes
  // (empty rows keep the size the same)
  // (with nothing running under the split it's on, that split goes near the top, with as much as fits under it)
  let at = list.findIndex(x => / on\b|^on\b/.test(x.cls));
  const parent = list.findIndex(x => x.cls === "parent");
  const from = Math.max(0, Math.min(at >= 0 ? at - (ROWS - 2) : parent >= 0 ? parent - 1 : list.length, list.length - ROWS));
  const shownRows = list.slice(from, from + ROWS);
  while (shownRows.length < ROWS) shownRows.push({cls: "blank", icon: null, name: "", d: "", dc: "", tm: ""});
  // (the rows are made once and then only changed, so the icons don't flicker)
  const box = $("rows");
  while (box.children.length < shownRows.length) box.insertAdjacentHTML("beforeend", `<div class="r"><img alt=""><span class="n"></span><span class="d"></span><span class="tm"></span></div>`);
  while (box.children.length > shownRows.length) box.lastChild.remove();
  shownRows.forEach((x, k) => {
    const el = box.children[k], [img, n, de, tm] = el.children;
    const src = x.icon && S.icons[x.icon] || "";
    if (img.getAttribute("src") !== src) { if (src) img.setAttribute("src", src); else img.removeAttribute("src"); }
    img.style.visibility = src ? "" : "hidden";
    el.className = "r " + x.cls;
    n.textContent = x.name; de.textContent = x.d; de.className = "d " + x.dc; tm.textContent = x.tm;
  });

  // what's left, going by the comparison (pace) and by the best segments (best possible time)
  const left = f => rows.filter(r => !r.fin).reduce((a, r) => a + Math.max(0, (f(r.i) ?? 0) - r.cur), 0);
  const pace = C ? now + left(c) : null, possible = best ? now + left(b) : null;
  const on = rows[ri];
  const t = $("timer");
  put(t, fmtMs(now, true));
  const liveD = on && ce(on.i) != null && now > ce(on.i) ? now - ce(on.i) : prevD;
  t.className = "big " + (S.done ? (pb && now < pb.final ? "gold" : C && C.final != null ? colour(now - C.final, true) : "") : !running ? "paused" : C ? colour(liveD, true) : "");
  // the split it's on (or the step of it, when it has sub-splits): its time so far, and the comparison's and the best
  const segCur = onSub ? onSub.cur : on ? on.cur : null;
  const segC = onSub ? (onSub.mid ? mc(onSub.mid) : cd(onSub.i, onSub.j)) : on ? c(on.i) : null;
  const segB = onSub ? (onSub.mid ? mb(onSub.mid) : bd(onSub.i, onSub.j)) : on ? b(on.i) : null;
  put($("segTimer"), segCur != null ? fmtMs(segCur) : "");
  put($("segComp"), C && on && comp !== "best" ? `${esc(C.short)}: ${segC != null ? fmt(segC) : "—"}` : "");
  put($("segBest"), on && best ? `Best: ${segB != null ? fmt(segB) : "—"}` : "");

  const fins = rows.filter(r => r.fin), prev = fins[fins.length - 1];
  const kv = (k, v, cl = "") => `<div class="kv"><span>${k}</span><span class="${cl}">${v}</span></div>`;
  let info = "";
  // the last split: against the comparison, and how much faster it's been done before (the time that could have been saved)
  if (prev && c(prev.i) != null) { const x = prev.cur - c(prev.i), g = b(prev.i) != null && prev.cur < b(prev.i);
    info += kv("Previous Segment", `<span class="${colour(x, x <= 0, g)}">${delta(x)}</span>` + (b(prev.i) != null ? ` / ${fmt(Math.max(0, prev.cur - b(prev.i)))}` : "")); }
  if (pace != null && !S.done) info += kv("Current Pace", fmt(pace, true));
  if (possible != null && !S.done) info += kv("Best Possible Time", fmt(possible, true));
  if (best) info += kv("Sum of Best Segments", fmt(best.final, true));
  put($("info"), info);

  // (on this computer's browser: the link for the phone page)
  const ph = $("phone"), showPhone = !RELAY && !window.obsstudio && S.phone;
  ph.classList.toggle("hide", !showPhone); if (showPhone) put(ph, `On your phone: <a href="${esc(S.phone)}" style="color:inherit">${esc(S.phone)}</a>`);
  const note = !S.siteRuns ? "No runs from the stats site yet, so there's nothing to compare with." : "";
  $("note").textContent = note; $("note").classList.toggle("hide", !note);
}
// every frame (for the milliseconds)
const frame = () => { render(); requestAnimationFrame(frame); };
requestAnimationFrame(frame);
</script>
</body>
</html>
